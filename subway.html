    function init() { 
        items.forEach(i => cart[i.id] = 0); 
        renderItems(); 
        updateEstimatedTotal(); 
    }

    function resetAll() { 
        items.forEach(i => cart[i.id] = 0); 
        document.getElementById('sizeSelect').value = "15";
        document.getElementById('setSelect').value = "none";
        renderItems(); 
        updateEstimatedTotal(); 
    }

    function setCategory(cat) { 
        currentCat = cat; 
        document.querySelectorAll('.tab-chip').forEach(b => b.classList.remove('active')); 
        event.target.classList.add('active'); 
        renderItems(); 
    }

    function applyPreset(type) {
        items.forEach(i => cart[i.id] = 0);
        if (type === 'protein') {
            cart['b1'] = 1;  // 위트 통밀빵
            cart['m4'] = 1;  // 로티세리 바비큐 치킨
            cart['s3'] = 1;  // 치킨 스트립 추가
            cart['v1'] = 1; cart['v2'] = 1; // 야채
            cart['s14'] = 1; // 올리브오일
        } else if (type === 'diet') {
            cart['b1'] = 1;  // 위트 통밀빵
            cart['m10'] = 1; // 로스트 치킨
            cart['v1'] = 1; cart['v2'] = 1; cart['v3'] = 1; // 야채 듬뿍
            cart['s14'] = 1; // 올리브오일
        } else if (type === 'value') {
            cart['b4'] = 1;  // 파마산 오레가노
            cart['m3'] = 1;  // 이탈리안 B.M.T.
            cart['v1'] = 1; cart['v2'] = 1;
            cart['s9'] = 1;  // 랜치 소스
        }
        renderItems();
        updateEstimatedTotal();
    }
    
    function renderItems() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const grid = document.getElementById('gridContainer'); 
        grid.innerHTML = '';
        
        const filtered = items.filter(i => (currentCat === 'all' || i.category === currentCat) && i.name.toLowerCase().includes(query));
        
        filtered.forEach(item => {
            const qty = cart[item.id];
            const card = document.createElement('div');
            card.className = `topping-card ${qty > 0 ? 'selected' : ''}`;
            
            const priceText = item.price === 0 ? "무료/포함" : `${item.price.toLocaleString()}원`;

            card.innerHTML = `
                <div class="card-header">
                    <h3>${item.name}</h3>
                    <p class="topping-info">${item.info}</p>
                    <p class="topping-price">${priceText}</p>
                </div>
                <div class="card-controls">
                    <button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button>
                    <span class="qty-val">${qty}</span>
                    <button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button>
                </div>`;
            grid.appendChild(card);
        });
    }

    function updateQty(id, delta) {
        if ((cart[id] + delta) >= 0) {
            cart[id] += delta;
            renderItems();
            updateEstimatedTotal();
        }
    }

    function updateEstimatedTotal() {
        const sizeMultiplier = parseInt(document.getElementById('sizeSelect').value) === 30 ? 2 : 1;
        const setKey = document.getElementById('setSelect').value;
        
        let price = 0;
        items.forEach(i => {
            if (cart[i.id] > 0) {
                if (i.category === 'main') {
                    price += (i.price * sizeMultiplier) * cart[i.id];
                } else {
                    price += i.price * cart[i.id];
                }
            }
        });

        price += setOptions[setKey].price;
        document.getElementById('estimatedTotalText').innerText = `약 ${price.toLocaleString()}원`;
    }

    function analyzeReceipt() {
        const paid = parseInt(document.getElementById('userPaidPrice').value);
        if (!paid) { alert("영수증 실제 결제액을 입력해주세요!"); return; }
        
        const sizeMultiplier = parseInt(document.getElementById('sizeSelect').value) === 30 ? 2 : 1;
        const setKey = document.getElementById('setSelect').value;
        
        let cost = 0;
        let prot = 0;
        let kcal = 0;
        let matchedMainItem = null;

        items.forEach(i => {
            if (cart[i.id] > 0) {
                if (i.category === 'main' || i.category === 'subpick') {
                    cost += (i.cost * sizeMultiplier) * cart[i.id];
                    prot += (i.protein * sizeMultiplier) * cart[i.id];
                    kcal += (i.kcal * sizeMultiplier) * cart[i.id];
                    if (!matchedMainItem) matchedMainItem = i;
                } else {
                    cost += i.cost * cart[i.id];
                    prot += i.protein * cart[i.id];
                    kcal += i.kcal * cart[i.id];
                }
            }
        });

        cost += setOptions[setKey].cost;
        prot += setOptions[setKey].protein;
        kcal += setOptions[setKey].kcal;

        const rate = ((cost / paid) * 100).toFixed(1);
        document.getElementById('statPaid').innerText = paid.toLocaleString() + "원";
        document.getElementById('statCost').innerText = "약 " + Math.round(cost).toLocaleString() + "원";
        document.getElementById('statProtein').innerText = prot.toFixed(1) + "g";
        document.getElementById('statCalorie').innerText = Math.round(kcal) + " kcal";
        document.getElementById('statRate').innerText = rate + "%";
        
        const subpickBox = document.getElementById('subpickBox');
        const subpickContent = document.getElementById('subpickContent');
        
        if (matchedMainItem && matchedMainItem.subpickName) {
            subpickBox.style.display = 'block';
            
            const spPrice = (matchedMainItem.subpickPrice * sizeMultiplier) + setOptions[setKey].price;
            const spKcal = Math.round((matchedMainItem.subpickKcal * sizeMultiplier) + setOptions[setKey].kcal);
            const spProtein = ((matchedMainItem.subpickProtein * sizeMultiplier) + setOptions[setKey].protein).toFixed(1);
            
            const sizeLabel = sizeMultiplier === 2 ? "30cm" : "15cm";
            const setLabel = setOptions[setKey].name;

            subpickContent.innerHTML = `
                • 비교 조건: <b>${matchedMainItem.subpickName} (${sizeLabel} + ${setLabel})</b><br>
                • 썹픽 기준가격: <span>${spPrice.toLocaleString()}원</span> (실제 지출: ${paid.toLocaleString()}원)<br>
                • 썹픽 기준칼로리: <span>${spKcal} kcal</span> (내 조합: ${Math.round(kcal)} kcal)<br>
                • 썹픽 기준단백질: <span>${spProtein}g</span> (내 조합: ${prot.toFixed(1)}g)
            `;
        } else {
            subpickBox.style.display = 'none';
        }

        const badge = document.getElementById('gradeBadge');
        if (rate < 18) { badge.className = "badge-grade grade-1"; badge.innerText = "🚨 1등급: 거품 폭발 호구존"; }
        else if (rate <= 35) { badge.className = "badge-grade grade-2"; badge.innerText = "🍽️ 2등급: 정상 외식 물가존"; }
        else { badge.className = "badge-grade grade-3"; badge.innerText = "🎉 3등급: 생태계 파괴존"; }
        
        document.getElementById('resultModal').style.display = 'flex';
    }

    function closeModal() { document.getElementById('resultModal').style.display = 'none'; }
    function shareResult() { navigator.clipboard.writeText("서브웨이 빵 및 썹픽 비교 가성비 판독 완료!"); alert("복사되었습니다!"); }
    
    init();
</script>

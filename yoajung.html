            cart['f5'] = 1; // 바나나
            cart['s1'] = 1; // 그래놀라
            cart['b8'] = 1; // 베이비슈(화이트) - 단백질 보강용 3번째 토핑
            alert("💪 [근성장 단백질 조합 (3개 토핑)]이 담겼습니다!");
        } else if (type === 'diet') {
            document.getElementById('baseSizeSelect').value = "1"; currentBase = "1";
            cart['f10'] = 1; // 자몽
            cart['f6'] = 1;  // 블루베리
            cart['f3'] = 1;  // 골드키위
            alert("🥗 [저칼로리 다이어트 조합 (3개 토핑)]이 담겼습니다!");
        } else if (type === 'king') {
            document.getElementById('baseSizeSelect').value = "2"; currentBase = "2";
            cart['f1'] = 1;  // 벌집꿀
            cart['f2'] = 1;  // 딸기
            cart['b12'] = 1; // 바스크번트치즈케이크
            alert("👑 [마진파괴 킹 조합 (3개 토핑)]이 담겼습니다!");
        }
        renderItems();
        updateEstimatedTotal();
    }

    function setCategory(cat) { currentCat = cat; document.querySelectorAll('.tab-chip').forEach(b => b.classList.remove('active')); event.target.classList.add('active'); renderItems(); }
    function renderItems() {
        const query = document.getElementById('searchInput').value.toLowerCase();
        const grid = document.getElementById('gridContainer'); grid.innerHTML = '';
        const filtered = items.filter(i => (currentCat === 'all' || i.category === currentCat) && i.name.toLowerCase().includes(query));
        filtered.forEach(item => {
            const card = document.createElement('div');
            card.className = `topping-card ${cart[item.id] > 0 ? 'selected' : ''}`;
            // 텍스트를 "예상가격 [가격]원"으로 수정 반영
            card.innerHTML = `<div class="card-header"><h3>${item.name}</h3><p class="topping-info">${item.info}</p><p class="topping-price">예상가격 ${item.price.toLocaleString()}원</p></div><div class="card-controls"><button class="btn-qty" onclick="updateQty('${item.id}', -1)">-</button><span class="qty-val">${cart[item.id]}</span><button class="btn-qty" onclick="updateQty('${item.id}', 1)">+</button></div>`;
            grid.appendChild(card);
        });
    }
    function updateQty(id, delta) { if (cart[id] + delta >= 0) { cart[id] += delta; renderItems(); updateEstimatedTotal(); } }
    function updateEstimatedTotal() {
        let price = bases[currentBase].price;
        items.forEach(i => { if (cart[i.id] > 0) price += i.price * cart[i.id]; });
        document.getElementById('estimatedTotalText').innerText = `약 ${price.toLocaleString()}원`;
    }
    function analyzeReceipt() {
        const paid = parseInt(document.getElementById('userPaidPrice').value);
        if (!paid) { alert("금액을 입력해주세요!"); return; }
        let cost = bases[currentBase].cost, prot = bases[currentBase].protein, kcal = bases[currentBase].kcal;
        items.forEach(i => { if (cart[i.id] > 0) { cost += i.cost * cart[i.id]; prot += i.protein * cart[i.id]; kcal += i.kcal * cart[i.id]; } });
        const rate = ((cost / paid) * 100).toFixed(1);
        document.getElementById('statPaid').innerText = paid.toLocaleString() + "원";
        document.getElementById('statCost').innerText = "약 " + cost.toLocaleString() + "원";
        document.getElementById('statProtein').innerText = prot.toFixed(1) + "g";
        document.getElementById('statCalorie').innerText = kcal.toFixed(1) + " kcal";
        document.getElementById('statRate').innerText = rate + "%";
        const badge = document.getElementById('gradeBadge');
        if (rate < 18) { badge.className = "badge-grade grade-1"; badge.innerText = "🚨 1등급: 거품 폭발 호구존"; }
        else if (rate <= 35) { badge.className = "badge-grade grade-2"; badge.innerText = "🍽️ 2등급: 정상 외식 물가존"; }
        else { badge.className = "badge-grade grade-3"; badge.innerText = "🎉 3등급: 생태계 파괴존"; }
        document.getElementById('resultModal').style.display = 'flex';
    }
    function closeModal() { document.getElementById('resultModal').style.display = 'none'; }
    function shareResult() { navigator.clipboard.writeText("요아정 공식 영양 성분 판독 완료!"); alert("복사되었습니다!"); }
    init();
</script>
</body>
</html>
